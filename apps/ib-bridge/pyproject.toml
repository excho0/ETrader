[project]
name = "etrader-ib-bridge"
version = "0.1.0"
description = "Async FastAPI and MCP trading bridge for ETrader"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "mcp>=1.18.0",
  "ib_async>=2.0.1",
  "peewee>=3.17.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
