name: etrader

services:
  ib-gateway:
    profiles: ["gw"]
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: etrader-ib-gateway
    restart: unless-stopped
    ports:
      - "4002:4002"
      - "5900:5900"
    environment:
      TWS_SETTINGS_PATH: ${IB_GATEWAY_SETTINGS_PATH:-/home/ibgateway/tws_settings}
      TWS_ACCEPT_INCOMING: "accept"
      CLEANUP_LOGS: "true"
    env_file:
      - path: ${IB_GATEWAY_ENV_FILE:-./ib-gateway.env}
        required: false
    volumes:
      - ${IB_GATEWAY_DATA_DIR:-./data/ib-gateway/tws_settings}:${IB_GATEWAY_SETTINGS_PATH:-/home/ibgateway/tws_settings}
    networks:
      etrader_net:
        ipv4_address: 172.30.0.2
        aliases:
          - ib-api
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4002'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  ib-tws:
    profiles: ["tws"]
    image: ghcr.io/gnzsnz/tws-rdesktop:stable
    container_name: etrader-ib-tws
    restart: unless-stopped
    ports:
      - "7496:7498"
      - "7497:7499"
      - "3370:3389"
    environment:
      TWS_SETTINGS_PATH: ${IB_TWS_SETTINGS_PATH:-/config/tws_settings}
      TWS_ACCEPT_INCOMING: "accept"
    env_file:
      - path: ${IB_TWS_ENV_FILE:-./ib-tws.env}
        required: false
    volumes:
      - ${IB_TWS_DATA_DIR:-./data/ib-tws}:/config
    networks:
      etrader_net:
        ipv4_address: 172.30.0.3
        aliases:
          - ib-api

  ib-bridge:
    profiles: ["mcp"]
    build:
      context: ./apps/ib-bridge
      dockerfile: Dockerfile
    container_name: etrader-ib-bridge
    restart: unless-stopped
    ports:
      - "8040:8040"
    env_file:
      - path: ${IB_BRIDGE_ENV_FILE:-./apps/ib-bridge/.env}
        required: false
    environment:
      API_HOST: 0.0.0.0
      IB_GATEWAY_HOST: ${IB_GATEWAY_HOST:-ib-gateway}
      IB_GATEWAY_PAPER_PORT: ${IB_GATEWAY_PAPER_PORT:-4002}
      IB_GATEWAY_LIVE_PORT: ${IB_GATEWAY_LIVE_PORT:-4001}
      IB_TWS_HOST: ${IB_TWS_HOST:-docker.host.internal}
      IB_TWS_PAPER_PORT: ${IB_TWS_PAPER_PORT:-7497}
      IB_TWS_LIVE_PORT: ${IB_TWS_LIVE_PORT:-7496}
      DATA_DIR: /data/ib-bridge
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8040
      MCP_HTTP_ISSUER_URL: ${MCP_HTTP_ISSUER_URL:-http://localhost:8040}
      MCP_HTTP_RESOURCE_SERVER_URL: ${MCP_HTTP_RESOURCE_SERVER_URL:-http://localhost:8040}
    volumes:
      - ${IB_BRIDGE_DATA_DIR:-./data/ib-bridge}:/data/ib-bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "docker.host.internal:host-gateway"
    networks:
      etrader_net:
        ipv4_address: 172.30.0.10

networks:
  etrader_net:
    name: etrader_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
